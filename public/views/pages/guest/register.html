<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../../../resources/lib/bootstrap.css" />
    <link rel="stylesheet" href="../../../resources/custom/css/style.css" />
    <script src="../../../resources/lib/bootstrap.js"></script>
</head>

<body>

    <div id="toast-wrapper"
        class="position-fixed top-0 start-50 translate-middle-x translate-md-none start-md-auto end-md-0 p-3"
        style="z-index: 9999;">
        <div id="alert-toast" class="toast text-white" role="alert" aria-live="assertive" aria-atomic="true"
            data-bs-delay="3000" data-bs-autohide="true">
            <div class="toast-body text-center p-3">
                Hello, world! This is a toast message.
            </div>
        </div>
    </div>

    <section id="RegistrationFormContainer" class="container center-on-desktop-top-on-mobile">
        <div class="col-lg-5 col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white border-bottom-radius-0 p-3">
                    <h3 class="text-center p-4">Greenband Web App</h3>
                </div>
                <div class="card-body p-lg-4">
                    <form method="POST" id="admin-registration" data-label="registration" enctype="multipart/form-data"
                        class="needs-validation mt-3 mt-lg-0" novalidate>
                        <div class="row g-3 mx-0">
                            <div class="col-lg-6 form-group my-3">
                                <input type="text" class="form-control py-3" name="firstname" placeholder="Firstname" />
                                <div class="invalid-feedback mt-2">Firstname is required</div>
                            </div>
                            <div class="col-lg-6 form-group my-3">
                                <input type="text" class="form-control py-3" name="lastname" placeholder="Lastname" />
                                <div class="invalid-feedback mt-2">Lastname is required</div>
                            </div>
                            <div class="col-lg-6 form-group my-3">
                                <select name="role" class="form-select py-3">
                                    <option>Super Admin</option>
                                    <option>System Admin</option>
                                </select>
                                <div class="invalid-feedback mt-2">Role is required</div>
                            </div>
                            <div class="col-lg-6 form-group my-3">
                                <input type="text" class="form-control py-3" name="phone-no"
                                    placeholder="Phone number" />
                                <div class="invalid-feedback mt-2">Phone number is required</div>
                            </div>
                            <div class="col-md-12 form-group my-3">
                                <input type="email" class="form-control py-3" name="email" placeholder="Email" />
                                <div class="invalid-feedback mt-2">Email is required</div>
                            </div>

                            <div class="col-md-12 form-group my-3">
                                <input type="password" class="form-control py-3" name="password"
                                    placeholder="Password" />
                                <div class="invalid-feedback mt-2">Password is required</div>
                            </div>

                            <div class="col-md-12">
                                <button type="submit" class="btn btn-primary mt-1 mb-4 p-2 w-100">
                                    <span class="spinner spinner-border spinner-border-sm d-none"
                                        aria-hidden="true"></span>
                                    <span class="button-text">Register Admin</span>
                                </button>

                                <div class="mb-4">
                                    <a href="/login" class="text-underline text-secondary">Go to my account</a>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="d-flex border-top border-light justify-content-center col-md-4 col-12 mt-4 p-2">
            <a class="mx-4 text-decoration-none text-secondary"><small>Help</small></a>
            <a class="mx-4 text-decoration-none text-secondary"><small>FAQ</small></a>
            <a class="mx-4 text-decoration-none text-secondary"><small>T&Cs</small></a>
        </div>
    </section>

    <script type="module" src="../../../resources/custom/js/forms.js"></script>
</body>

</html>
